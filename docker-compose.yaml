services:
  postgres:
    restart: unless-stopped
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - neurobrew-pgdata:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"


volumes:
  neurobrew-pgdata:
